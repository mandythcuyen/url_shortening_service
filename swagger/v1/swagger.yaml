---
openapi: 3.0.1
info:
  title: API V1
  version: v1
  description: URL shortening service
paths:
  "/api/v1/encode":
    post:
      summary: Shortens an original URL
      tags:
      - Short links
      description: Returns a short code for the given URL. The same URL sent twice
        within a session returns the same short code.
      parameters: []
      responses:
        '200':
          description: short link created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncodeResult"
        '422':
          description: invalid URL
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UrlPayload"
  "/api/v1/decode/{short_code}":
    get:
      summary: Resolves a short code back to its original URL
      tags:
      - Short links
      parameters:
      - name: short_code
        in: path
        required: true
        description: Short code, 4 to 10 alphanumeric characters
        example: GeAi9K
        schema:
          type: string
      responses:
        '200':
          description: original URL found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DecodeResult"
        '404':
          description: short code not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/{short_code}":
    get:
      summary: Redirects a short code to its original URL
      tags:
      - Redirect
      description: Responds with a 301 to the original URL, or 404 when the short
        code is unknown or points to an unsafe URL.
      parameters:
      - name: short_code
        in: path
        required: true
        description: Short code, 4 to 10 alphanumeric characters
        example: GeAi9K
        schema:
          type: string
      responses:
        '301':
          description: redirects to the original URL
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Original URL
        '404':
          description: short code not found or unsafe URL
servers:
- url: http://localhost:3000
  variables:
    endPoint:
      default: http://localhost:3000
  description: localhost
- url: https://staging.mandyseeyoo.com
  variables:
    endPoint:
      default: https://staging.mandyseeyoo.com
  description: staging
components:
  schemas:
    UrlPayload:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://codesubmit.io/library/react
      required:
      - url
    EncodeResult:
      type: object
      properties:
        short_code:
          type: string
          example: GeAi9K
        short_url:
          type: string
          format: uri
          example: https://mandyseeyoo.com/GeAi9K
      required:
      - short_code
      - short_url
    DecodeResult:
      type: object
      properties:
        short_code:
          type: string
          example: GeAi9K
        original_url:
          type: string
          format: uri
          example: https://codesubmit.io/library/react
      required:
      - short_code
      - original_url
    Error:
      type: object
      properties:
        error:
          type: string
          example: Short code not found
    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
            example: URL scheme is invalid. Only http and https are allowed.
      required:
      - errors
